<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Sevilla Este</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f2b705" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5" fill="#f2b705"/></svg>Mapa de Sevilla Este</h1>
  <div id="bus"><span class="qi"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffd966" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span><input id="q" type="search" placeholder="Buscar lugar…" autocomplete="off" maxlength="60"><div id="qr" hidden></div></div>
  <div><span id="who" class="msg" style="color:#ffd966"></span> <button id="auth" class="pri">Entrar</button></div>
</header>
<main><div id="map"></div><aside id="panel"></aside></main>
<div id="toast"></div>

<dialog id="dLogin">
  <div class="tabs"><button id="tabIn" class="on">Entrar</button><button id="tabUp">Crear cuenta</button></div>
  <div id="fUp" style="display:none"><label>Nombre de usuario</label><input id="uName" maxlength="20" autocomplete="username" placeholder="3-20 letras, números o _"></div>
  <label id="lEmail">Email o usuario</label><input id="uEmail" autocomplete="username">
  <label>Contraseña</label><input id="uPass" type="password" autocomplete="current-password">
  <div class="msg" id="loginMsg"></div>
  <div class="row"><button id="loginCancel">Cerrar</button><button id="loginGo" class="pri">Entrar</button></div>
</dialog>
<dialog id="dNew">
  <b id="newTitle">Nuevo lugar</b>
  <label>Nombre</label><input id="nName" maxlength="80">
  <label>Categoría</label><select id="nCat"></select>
  <label>Descripción</label><textarea id="nDesc" rows="3" maxlength="300"></textarea>
  <div class="msg" id="newMsg"></div>
  <div class="row"><button id="newCancel">Cancelar</button><button id="newGo" class="pri">Publicar</button></div>
</dialog>
<dialog id="dImg"><img id="bigImg" style="width:100%;border-radius:10px"><div class="row"><button onclick="document.getElementById('dImg').close()">Cerrar</button></div></dialog>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
// Comprobaciones: si algo falta, lo decimos en pantalla en vez de quedarnos en blanco
(function () {
  let msg = "";
  if (typeof L === "undefined" || typeof supabase === "undefined") msg = "No se han podido cargar las librerías de internet. Comprueba la conexión o desactiva el bloqueador de anuncios para esta página.";
  else if (typeof SUPABASE_URL === "undefined" || typeof SUPABASE_KEY === "undefined" || typeof LIMITE === "undefined") msg = "No se encuentra el archivo config.js. Tiene que estar en la misma carpeta que index.html.";
  else if (String(SUPABASE_URL).includes("PEGA_AQUI") || String(SUPABASE_KEY).includes("PEGA_AQUI")) msg = "El archivo config.js todavía tiene los textos PEGA_AQUI. Pega tu Project URL y tu clave anon de Supabase.";
  if (msg) {
    document.getElementById("panel").innerHTML = "<p><b>Falta configurar algo</b></p><p>" + msg + "</p>";
    throw new Error(msg);
  }
})();
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DIB = location.search.includes("dibujar");

// ---------- Iconos propios ----------
const IC = {
  comer:"M6 3v6a2 2 0 0 0 4 0V3M8 9v12M16 21V3c-2 1.5-3 4-3 7h3",
  eventos:"M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z",
  compras:"M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0",
  ocio:"M12 21v-6M12 15c-4 0-6-3-5-6 0-3 2-5 5-6 3 1 5 3 5 6 1 3-1 6-5 6z",
  servicios:"M15 4a4.5 4.5 0 0 0-4 6L4 17l3 3 7-7a4.5 4.5 0 0 0 6-4l-3 3-3-1-1-3 3-3z",
  otros:"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z",
  todos:"M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11zM12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",
  nuevo:"M12 5v14M5 12h14", ok:"M5 12l5 5 9-10", edit:"M4 20h4L19 9l-4-4L4 16zM14 6l4 4", trash:"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3", eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z", back:"M15 18l-6-6 6-6"
};
const CATS = {comer:["Comer","#7a1230","#fff"],eventos:["Eventos","#f2b705","#4a0b1d"],compras:["Compras","#b83255","#fff"],ocio:["Ocio","#6b7d1f","#fff"],servicios:["Servicios","#a35f00","#fff"],otros:["Otros","#4a0b1d","#ffd966"]};
const svg = (d, s = 18, c = "currentColor") => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const cc = k => CATS[k] || CATS.otros;
const badge = (k, s = 30) => `<span class="bd" style="width:${s}px;height:${s}px;background:${cc(k)[1]}">${svg(IC[k] || IC.otros, s * .6, cc(k)[2])}</span>`;
const pin = (k, hot, sel) => `<div class="mk${hot ? " hot" : ""}${sel ? " sel" : ""}"><svg viewBox="0 0 40 52"><path d="M20 50C20 50 4 32 4 19a16 16 0 0 1 32 0c0 13-16 31-16 31z" fill="${cc(k)[1]}" stroke="#fff" stroke-width="2.5"/><g transform="translate(8 7)" fill="none" stroke="${cc(k)[2]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[k] || IC.otros}"/></g></svg></div>`;
const stars = n => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));
const score = p => (p.destacado ? 1e6 : 0) + p.avg_rating * Math.log(1 + p.n_ratings) + p.n_visits * 0.5 + p.n_photos * 0.2;
const heart = (on, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${on ? "#d6285a" : "none"}" stroke="${on ? "#d6285a" : "currentColor"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5.4-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.6-8 11-8 11z"/></svg>`;
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), 9000); }

const espTxt = m => { const s = +(/espera_general:(\d+)/.exec(m) || [])[1] || 300; return `En General solo puedes enviar un mensaje cada 5 minutos. Te quedan ${Math.floor(s / 60)} min ${s % 60} s.`; };
const errTxt = m => /espera_general/.test(m) ? espTxt(m) : /enlace_no_permitido/.test(m) ? "Ese texto contiene un enlace no permitido. Solo se admiten enlaces de sitios de confianza." : /demasiados_mensajes/.test(m) ? "Vas muy rápido: espera un momento." : /limite_chats/.test(m) ? "Has llegado al límite de chats que puedes crear." : "Error: " + m;
$("nCat").innerHTML = Object.entries(CATS).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join("");

// ---------- Mapa limitado al contorno ----------
const map = L.map("map", {zoomSnap: 0.25, zoomDelta: 0.5, maxBoundsViscosity: 0.6, trackResize: false, minZoom: 14, maxZoom: 18.5});
const B = L.polygon(LIMITE).getBounds();
const IMG = L.latLngBounds([37.38493, -5.94965], [37.41892, -5.88268]); // dónde van colocadas las imágenes
map.fitBounds(B);
map.setMaxBounds(IMG.pad(0.3));

// A partir de qué zoom se usa cada imagen (puedes ajustar los números z)
const NIVELES = [
  {z: 0,     img: "img/n1.webp"},   // 1. zonas y avenidas grandes
  {z: 15.5,  img: "img/n2.webp"},   // 2. barrios pequeños
  {z: 16.25, img: "img/n3.webp"},   // 3. calles principales y parques
  {z: 17,    img: "img/n4.webp"},   // 4. todas las calles
  {z: 17.75, img: "img/n4.webp"}             // 5. todas las calles (final)
];
const nivelDe = z => NIVELES.reduce((n, v, i) => z >= v.z ? i : n, 0);

// Imagen sin nombres: siempre debajo, es la que se ve mientras haces zoom
const fondo = L.imageOverlay("img/base.webp", IMG, {interactive: false, zIndex: 1}).addTo(map);
let capa = null, capaImg = "", espera;
function mostrar() {
  const n = nivelDe(map.getZoom()), url = NIVELES[n].img;
  if (capa && capaImg === url) { capa.setOpacity(1); }
  else {
    if (capa) map.removeLayer(capa);          // libera memoria de la imagen anterior
    const c = capa = L.imageOverlay(url, IMG, {interactive: false, opacity: 0, zIndex: 2}).addTo(map);
    capaImg = url;
    c.once("load", () => { if (capa === c) c.setOpacity(1); });
  }
  new Image().src = NIVELES[Math.min(n + 1, NIVELES.length - 1)].img;  // precarga la siguiente
}
map.on("zoomstart", () => { clearTimeout(espera); if (capa) capa.setOpacity(0); });
map.on("zoomend", () => { clearTimeout(espera); espera = setTimeout(mostrar, 140); });
fondo.once("load", mostrar);
fondo.on("error", () => toast("No se encuentran las imágenes. Revisa que la carpeta img esté junto a index.html y tenga los 5 archivos."));

// Al cambiar el tamaño de la ventana, se actualiza una sola vez al soltar
let rt;
new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => map.invalidateSize({animate: false}), 250); }).observe($("map"));
function dentro(ll) {
  let r = false;
  for (let i = 0, j = LIMITE.length - 1; i < LIMITE.length; j = i++) {
    const [yi, xi] = LIMITE[i], [yj, xj] = LIMITE[j];
    if ((yi > ll.lat) !== (yj > ll.lat) && ll.lng < (xj - xi) * (ll.lat - yi) / (yj - yi) + xi) r = !r;
  }
  return r;
}
const layer = L.layerGroup().addTo(map);

// ---------- Estado y datos ----------
let favs = new Set(), editId = null, esAdmin = false, user = null, places = [], cat = "todos", tab = "top", sel = null, newPos = null, tmp = null;
async function load() {
  const { data, error } = await sb.from("place_stats").select("*");
  if (error) { $("panel").innerHTML = `<p>No se pudo cargar: ${esc(error.message)}</p>`; return; }
  places = data || []; render();
}
const filtered = () => {
  const l = places.filter(p => cat === "todos" || p.category === cat);
  if (tab === "fav") return l.filter(p => favs.has(p.id)).sort((a, b) => a.name.localeCompare(b.name, "es"));
  return tab === "top" ? l.sort((a, b) => score(b) - score(a)) : l.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
};

function render() {
  if (DIB) return;
  layer.clearLayers();
  const top = new Set(places.filter(p => score(p) > 0).sort((a, b) => score(b) - score(a)).slice(0, 3).map(p => p.id));
  filtered().forEach(p => {
    L.marker([p.lat, p.lng], {icon: L.divIcon({className: "", html: pin(p.category, top.has(p.id), p.id === sel), iconSize: [34, 44], iconAnchor: [17, 44]})})
      .addTo(layer).on("click", () => openPlace(p.id));
  });
  sel ? detail() : list();
}

function list() {
  if (DIB) return;
  const items = filtered();
  $("panel").innerHTML = `
    <div class="hint">${user ? "Toca el mapa, dentro del contorno, para añadir un lugar." : "Entra con tu email para añadir lugares, valorar y subir fotos."}</div>
    <div class="tabs"><button data-t="top" class="${tab === "top" ? "on" : ""}">${svg(IC.eventos, 16)} Destacados</button><button data-t="new" class="${tab === "new" ? "on" : ""}">${svg(IC.nuevo, 16)} Nuevos</button><button data-t="fav" class="${tab === "fav" ? "on" : ""}">${heart(false, 16)} Favoritos</button></div>
    <div class="chips">${["todos", ...Object.keys(CATS)].map(k => `<button class="chip ${cat === k ? "on" : ""}" data-c="${k}">${k === "todos" ? `<span class="bd" style="width:24px;height:24px;background:#7a1230">${svg(IC.todos, 15, "#ffd966")}</span> Todos` : badge(k, 24) + " " + CATS[k][0]}</button>`).join("")}</div>
    ${items.length ? items.map((p, i) => `<div class="item" data-id="${p.id}">${badge(p.category, 38)}<div><b>${tab === "top" ? `<span class="rk">#${i + 1}</span>` : ""}${esc(p.name)}${p.destacado ? '<span class="dstc">DESTACADO</span>' : ""}${favs.has(p.id) ? ' <span class="fv">♥</span>' : ""}</b><small>${p.n_ratings ? `<span class="st">${stars(p.avg_rating)}</span> (${p.n_ratings})` : "Sin valoraciones"} · ${p.n_visits} visitas · ${p.n_photos} fotos</small></div></div>`).join("") : `<p class='msg'>${tab === "fav" ? (user ? "Aún no tienes favoritos. Abre un lugar y pulsa «Añadir a favoritos»." : "Entra para guardar tus lugares favoritos.") : "Todavía no hay lugares aquí. ¡Añade el primero!"}</p>`}`;
  $("panel").querySelectorAll("[data-t]").forEach(b => b.onclick = () => { if (b.dataset.t === "fav" && !need()) return; tab = b.dataset.t; render(); });
  $("panel").querySelectorAll("[data-c]").forEach(b => b.onclick = () => { cat = b.dataset.c; render(); });
  $("panel").querySelectorAll("[data-id]").forEach(b => b.onclick = () => openPlace(+b.dataset.id));
}

function openPlace(id) { sel = id; const p = places.find(x => x.id === id); if (p) map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 17)); render(); }

async function detail() {
  const p = places.find(x => x.id === sel);
  if (!p) { sel = null; return list(); }
  const { data: ph } = await sb.from("photos").select("*").eq("place_id", sel).order("created_at", {ascending: false});
  const fotos = (ph || []).map(f => ({id: f.id, uid: f.user_id, url: sb.storage.from("photos").getPublicUrl(f.path).data.publicUrl}));
  const { data: rvd } = await sb.from("ratings").select("stars,comment,created_at,user_id,profiles(username)").eq("place_id", sel).order("created_at", {ascending: false});
  const rv = rvd || [], mia = user ? rv.find(r => r.user_id === user.id) : null;
  let pick = mia ? mia.stars : 0;
  const { data: ocd } = await sb.from("ocultos").select("kind,ref").eq("place_id", sel);
  const oc = new Set((ocd || []).map(o => o.kind[0] + ":" + o.ref)), mod = !!user && (p.created_by === user.id || esAdmin);
  $("panel").innerHTML = `
    <button id="back">${svg(IC.back, 16)} Volver</button>
    <div style="display:flex;gap:10px;align-items:center;margin:12px 0 4px">${badge(p.category, 44)}<h2 style="margin:0">${esc(p.name)}</h2>${p.destacado ? '<span class="dstc">DESTACADO</span>' : ""}</div>
    <div class="msg">${p.n_ratings ? `<span class="st">${stars(p.avg_rating)}</span> ${Number(p.avg_rating).toFixed(1)} (${p.n_ratings} votos)` : "Sin valoraciones todavía"} · ${p.n_visits} visitas</div>
    <p>${esc(p.description) || "<i>Sin descripción</i>"}</p>
    ${user && (p.created_by === user.id || esAdmin) ? `<div class="row" style="justify-content:flex-start;margin:0 0 10px"><button id="edit">${svg(IC.edit, 16)} Editar</button><button id="del">${svg(IC.trash, 16)} Eliminar</button>${esAdmin ? `<button id="dest">${p.destacado ? "Quitar de destacados" : "Destacar"}</button>` : ""}</div>` : ""}
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button id="visit" class="pri">${svg(IC.ok, 16)} Estuve aquí hoy</button><button id="fav">${heart(favs.has(p.id), 16)} ${favs.has(p.id) ? "En favoritos" : "Añadir a favoritos"}</button><button id="share">Compartir en el foro</button></div>
    <b style="display:block;margin-top:16px">Tu reseña</b>
    <div class="stars" id="pick">${[1,2,3,4,5].map(n => `<button data-s="${n}" class="${pick >= n ? "on" : ""}">★</button>`).join("")}</div>
    <textarea id="rText" rows="3" maxlength="500" placeholder="Cuenta tu experiencia (opcional)">${esc(mia ? mia.comment : "")}</textarea>
    <div class="row" style="justify-content:flex-start"><button id="rSave" class="pri">${mia ? "Actualizar reseña" : "Publicar reseña"}</button>${mia ? `<button id="rDel">Borrar mi reseña</button>` : ""}</div>
    <b style="display:block;margin-top:14px">Reseñas (${rv.length})</b>
    ${rv.map(r => { const hid = oc.has("r:" + r.user_id), ajena = !user || r.user_id !== user.id;
      return `<div class="rv"><b>${esc((r.profiles && r.profiles.username) || "Vecino")}</b> <span class="st">${stars(r.stars)}</span> <small class="msg">${new Date(r.created_at).toLocaleDateString("es-ES")}</small>${mod ? ` <button class="lnk" data-oc="r:${r.user_id}">${hid ? "Mostrar a todos" : "Ocultar"}</button>` : ""}${esAdmin && ajena ? ` <button class="lnk" data-delr="${r.user_id}">Borrar</button>` : ""}${r.comment ? (hid ? `<div class="msg">Comentario oculto por el creador del sitio. <button class="lnk" data-ver>Ver</button></div><div hidden>${esc(r.comment)}</div>` : `<div>${esc(r.comment)}</div>`) : ""}</div>`; }).join("") || "<span class='msg'>Aún no hay reseñas.</span>"}
    <b style="display:block;margin-top:16px">Fotos</b>
    <input id="file" type="file" accept="image/*" style="margin-top:6px">
    <div class="msg" id="dMsg"></div>
    <div class="gal">${fotos.map(f => { const hid = oc.has("f:" + f.id);
      return `<div class="ph ${hid ? "oc" : ""}"><img src="${f.url}" loading="lazy" alt="Foto del lugar">${hid ? '<span class="ocl">Oculta</span>' : ""}${user && (f.uid === user.id || esAdmin) ? `<button class="px" data-p="${f.id}" title="Borrar foto">${svg(IC.trash, 14, "#fff")}</button>` : ""}${mod ? `<button class="pe" data-oc="f:${f.id}" title="${hid ? "Mostrar a todos" : "Ocultar"}">${svg(IC.eye, 14, "#fff")}</button>` : ""}</div>`; }).join("") || "<span class='msg'>Aún no hay fotos.</span>"}</div>`;
  $("back").onclick = () => { sel = null; render(); };
  $("pick").querySelectorAll("[data-s]").forEach(b => b.onclick = () => { pick = +b.dataset.s; $("pick").querySelectorAll("[data-s]").forEach(x => x.classList.toggle("on", +x.dataset.s <= pick)); });
  $("rSave").onclick = () => guardarResena(pick, $("rText").value.trim());
  if ($("rDel")) $("rDel").onclick = borrarResena;
  $("panel").querySelectorAll("[data-p]").forEach(b => b.onclick = e => { e.stopPropagation(); borrarFoto(+b.dataset.p); });
  $("panel").querySelectorAll("[data-oc]").forEach(b => b.onclick = e => { e.stopPropagation(); alternarOculto(b.dataset.oc); });
  $("panel").querySelectorAll("[data-ver]").forEach(b => b.onclick = () => { b.parentElement.hidden = true; b.parentElement.nextElementSibling.hidden = false; });
  $("panel").querySelectorAll("[data-delr]").forEach(b => b.onclick = () => borrarResenaDe(b.dataset.delr));
  $("share").onclick = () => { if (need()) foroCompartir(p.id); };
  $("visit").onclick = visit;
  $("fav").onclick = toggleFav;
  if ($("dest")) $("dest").onclick = () => destacar(p);
  if ($("edit")) { $("edit").onclick = () => editar(p); $("del").onclick = () => borrar(p); }
  $("file").onchange = e => upload(e.target.files[0]);
  $("panel").querySelectorAll(".gal img").forEach(i => i.onclick = () => { $("bigImg").src = i.src; $("dImg").showModal(); });
}

// ---------- Favoritos, destacados y buscador ----------
async function cargarFavs() {
  favs = new Set();
  if (!user) return;
  const { data } = await sb.from("favoritos").select("place_id");
  (data || []).forEach(f => favs.add(f.place_id));
}
async function toggleFav() {
  if (!need()) return;
  const quitar = favs.has(sel);
  const { error } = quitar
    ? await sb.from("favoritos").delete().eq("place_id", sel).eq("user_id", user.id)
    : await sb.from("favoritos").insert({place_id: sel});
  if (error) return toast(errTxt(error.message));
  quitar ? favs.delete(sel) : favs.add(sel);
  detail(); toast(quitar ? "Quitado de favoritos." : "Añadido a favoritos.");
}
async function destacar(p) {
  const { error } = await sb.rpc("marcar_destacado", {p_id: p.id, valor: !p.destacado});
  if (error) return toast(/solo_admin/.test(error.message) ? "Solo el administrador puede hacerlo." : errTxt(error.message));
  await load(); toast(p.destacado ? "Quitado de destacados." : "Lugar destacado.");
}
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
let qRes = [], qSel = 0;
function qPintar() { $("qr").querySelectorAll("[data-q]").forEach((el, i) => el.classList.toggle("on", i === qSel)); }
function buscar() {
  const t = norm($("q").value.trim()), box = $("qr");
  if (!t) { box.hidden = true; return; }
  const pal = t.split(/\s+/);
  qRes = places.filter(p => { const h = norm(p.name + " " + (p.description || "") + " " + cc(p.category)[0]); return pal.every(w => h.includes(w)); })
    .sort((a, b) => (norm(b.name).startsWith(t) - norm(a.name).startsWith(t)) || score(b) - score(a)).slice(0, 8);
  qSel = 0;
  box.innerHTML = qRes.length
    ? qRes.map(p => `<div class="it" data-q="${p.id}">${badge(p.category, 30)}<div><b>${esc(p.name)}</b>${p.destacado ? '<span class="dstc">DESTACADO</span>' : ""}<br><small class="msg">${cc(p.category)[0]}${p.n_ratings ? " · " + Number(p.avg_rating).toFixed(1) + " ★" : ""}</small></div></div>`).join("")
    : '<div class="it msg">Sin resultados</div>';
  box.hidden = false; qPintar();
  box.querySelectorAll("[data-q]").forEach(el => el.onmousedown = e => { e.preventDefault(); irA(+el.dataset.q); });
}
function irA(id) {
  $("q").value = ""; $("qr").hidden = true; $("q").blur(); cat = "todos";
  if (typeof foroVista === "function") foroVista("mapa");
  openPlace(id);
}
$("q").oninput = buscar;
$("q").onfocus = buscar;
$("q").onblur = () => { $("qr").hidden = true; };
$("q").onkeydown = e => {
  if (e.key === "Escape") { $("qr").hidden = true; $("q").blur(); }
  else if (e.key === "ArrowDown" && qRes.length) { e.preventDefault(); qSel = (qSel + 1) % qRes.length; qPintar(); }
  else if (e.key === "ArrowUp" && qRes.length) { e.preventDefault(); qSel = (qSel - 1 + qRes.length) % qRes.length; qPintar(); }
  else if (e.key === "Enter" && qRes.length && !$("qr").hidden) { e.preventDefault(); irA(qRes[qSel].id); }
};

// ---------- Acciones ----------
function need() { if (user) return true; modo(false); $("dLogin").showModal(); return false; }
const say = t => { const m = $("dMsg"); if (m) m.textContent = t; };
async function guardarResena(n, texto) {
  if (!need()) return;
  if (!n) return say("Elige de 1 a 5 estrellas.");
  const { error } = await sb.from("ratings").upsert({place_id: sel, user_id: user.id, stars: n, comment: texto || null}, {onConflict: "place_id,user_id"});
  if (error) return say(errTxt(error.message));
  await load(); toast("¡Gracias por tu reseña!");
}
async function borrarResena() {
  if (!confirm("¿Borrar tu reseña?")) return;
  const { error } = await sb.from("ratings").delete().eq("place_id", sel).eq("user_id", user.id);
  if (error) return say(errTxt(error.message));
  await load(); toast("Reseña borrada.");
}
async function alternarOculto(clave) {
  const kind = clave[0] === "r" ? "resena" : "foto", ref = clave.slice(2);
  const { data: ex } = await sb.from("ocultos").select("id").eq("place_id", sel).eq("kind", kind).eq("ref", ref);
  const { error } = ex && ex.length ? await sb.from("ocultos").delete().eq("id", ex[0].id) : await sb.from("ocultos").insert({place_id: sel, kind, ref});
  if (error) return toast(errTxt(error.message));
  detail();
}
async function borrarResenaDe(uid) {
  if (!confirm("¿Borrar esta reseña?")) return;
  const { error } = await sb.from("ratings").delete().eq("place_id", sel).eq("user_id", uid);
  if (error) return toast(errTxt(error.message));
  await load(); toast("Reseña borrada.");
}
async function borrarFoto(id) {
  if (!confirm("¿Borrar tu foto?")) return;
  const { data, error } = await sb.from("photos").delete().eq("id", id).select();
  if (error) return toast(errTxt(error.message));
  if (!data || !data.length) return toast("No puedes borrar esta foto.");
  await sb.storage.from("photos").remove([data[0].path]);
  await load(); toast("Foto borrada.");
}
async function visit() {
  if (!need()) return;
  const { error } = await sb.from("visits").upsert({place_id: sel, user_id: user.id}, {onConflict: "place_id,user_id,day", ignoreDuplicates: true});
  if (error) return say(errTxt(error.message));
  await load(); toast("¡Visita registrada!");
}
function resize(file, max = 1280) {
  return new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok(b) : ko(new Error("No se pudo procesar la imagen")), "image/jpeg", 0.82);
    };
    img.onerror = () => ko(new Error("Imagen no válida"));
    img.src = URL.createObjectURL(file);
  });
}
async function upload(file) {
  if (!file || !need()) return;
  if (!file.type.startsWith("image/")) return say("Solo se admiten imágenes.");
  if (file.size > 15e6) return say("Imagen demasiado grande (máx. 15 MB).");
  try {
    say("Subiendo...");
    const blob = await resize(file), path = `${sel}/${user.id}-${Date.now()}.jpg`;
    const up = await sb.storage.from("photos").upload(path, blob, {contentType: "image/jpeg"});
    if (up.error) throw up.error;
    const ins = await sb.from("photos").insert({place_id: sel, user_id: user.id, path});
    if (ins.error) throw ins.error;
    await load();
  } catch (e) { say("Error: " + e.message); }
}

// ---------- Crear lugar ----------
if (!DIB) map.on("click", e => {
  if (!dentro(e.latlng)) return toast("Solo se pueden añadir lugares dentro de Sevilla Este.");
  if (!need()) return;
  newPos = e.latlng;
  if (tmp) tmp.remove();
  tmp = L.marker(e.latlng).addTo(map);
  modoDialogo(null); $("newMsg").textContent = ""; $("dNew").showModal();
});
function closeNew() { $("dNew").close(); if (tmp) { tmp.remove(); tmp = null; } }
$("newCancel").onclick = closeNew;
function modoDialogo(p) {
  const venia = editId !== null;
  editId = p ? p.id : null;
  if (p) { $("nName").value = p.name; $("nCat").value = p.category; $("nDesc").value = p.description || ""; }
  else if (venia) { $("nName").value = ""; $("nDesc").value = ""; }
  $("newTitle").textContent = p ? "Editar lugar" : "Nuevo lugar";
  $("newGo").textContent = p ? "Guardar cambios" : "Publicar";
}
function editar(p) { modoDialogo(p); $("newMsg").textContent = ""; $("dNew").showModal(); }
async function borrar(p) {
  if (!confirm("¿Eliminar «" + p.name + "»? Se borrarán también sus valoraciones, visitas y fotos. No se puede deshacer.")) return;
  try {
    const { data: ph } = await sb.from("photos").select("path").eq("place_id", p.id);
    const { data: del, error } = await sb.from("places").delete().eq("id", p.id).select();
    if (error) throw error;
    if (!del || !del.length) throw new Error("No tienes permiso para eliminar este lugar.");
    if (ph && ph.length) await sb.storage.from("photos").remove(ph.map(f => f.path));
    sel = null; await load(); toast("Lugar eliminado.");
  } catch (e) { say("Error: " + e.message); }
}
$("newGo").onclick = async () => {
  const name = $("nName").value.trim();
  if (name.length < 2) { $("newMsg").textContent = "Pon un nombre."; return; }
  const campos = {name, category: $("nCat").value, description: $("nDesc").value.trim()};
  if (editId !== null) {
    const { data, error } = await sb.from("places").update(campos).eq("id", editId).select();
    if (error) { $("newMsg").textContent = errTxt(error.message); return; }
    if (!data || !data.length) { $("newMsg").textContent = "No tienes permiso para editar este lugar."; return; }
    closeNew(); await load(); toast("Cambios guardados.");
    return;
  }
  const { data, error } = await sb.from("places").insert({...campos, lat: newPos.lat, lng: newPos.lng}).select().single();
  if (error) { $("newMsg").textContent = errTxt(error.message); return; }
  $("nName").value = ""; $("nDesc").value = "";
  closeNew(); await load(); openPlace(data.id);
};

// ---------- Cuenta ----------
let modoUp = false, miNombre = "";
function modo(up) {
  modoUp = up;
  $("tabIn").classList.toggle("on", !up); $("tabUp").classList.toggle("on", up);
  $("fUp").style.display = up ? "block" : "none";
  $("lEmail").textContent = up ? "Email" : "Email o usuario";
  $("uPass").autocomplete = up ? "new-password" : "current-password";
  $("loginGo").textContent = up ? "Crear cuenta" : "Entrar";
  $("loginMsg").textContent = "";
}
$("tabIn").onclick = () => modo(false);
$("tabUp").onclick = () => modo(true);
$("auth").onclick = async () => { if (user) await sb.auth.signOut(); else { modo(false); $("dLogin").showModal(); } };
$("loginCancel").onclick = () => $("dLogin").close();
const trad = m => /Invalid login/i.test(m) ? "Usuario o contraseña incorrectos." : /already registered/i.test(m) ? "Ese email ya tiene una cuenta." : /not confirmed/i.test(m) ? "Confirma tu email antes de entrar (revisa tu bandeja)." : /rate limit/i.test(m) ? "Demasiados intentos. Espera un rato." : m;
$("loginGo").onclick = async () => {
  const id = $("uEmail").value.trim(), pass = $("uPass").value, msg = t => { $("loginMsg").textContent = t; };
  if (!id || !pass) return msg("Rellena todos los campos.");
  $("loginGo").disabled = true;
  try {
    if (modoUp) {
      const u = $("uName").value.trim();
      if (!/^[A-Za-z0-9_]{3,20}$/.test(u)) return msg("El usuario debe tener de 3 a 20 letras, números o _ .");
      if (!id.includes("@")) return msg("Escribe un email válido.");
      if (pass.length < 8) return msg("La contraseña debe tener al menos 8 caracteres.");
      const { data: libre, error: e0 } = await sb.rpc("username_disponible", {nombre: u});
      if (e0) throw e0;
      if (!libre) return msg("Ese nombre de usuario ya está cogido.");
      const { data, error } = await sb.auth.signUp({email: id, password: pass, options: {data: {username: u}, emailRedirectTo: location.href.split("#")[0].split("?")[0]}});
      if (error) throw error;
      if (!data.session) return msg("Cuenta creada. Revisa tu email y confirma para poder entrar.");
    } else if (id.includes("@")) {
      const { error } = await sb.auth.signInWithPassword({email: id, password: pass});
      if (error) throw error;
    } else {
      const { data, error } = await sb.functions.invoke("login", {body: {username: id, password: pass}});
      if (error) throw new Error("Entrar con usuario aún no está activado. Entra con tu email.");
      if (data.error) return msg(data.error);
      const r = await sb.auth.setSession({access_token: data.access_token, refresh_token: data.refresh_token});
      if (r.error) throw r.error;
    }
  } catch (e) { msg(trad(e.message || String(e))); }
  finally { $("loginGo").disabled = false; }
};
const paintUser = () => { $("auth").textContent = user ? "Salir" : "Entrar"; $("who").textContent = user ? (miNombre || user.email) : ""; };
async function cargarNombre() {
  miNombre = ""; esAdmin = false;
  if (user) {
    const { data } = await sb.from("profiles").select("username,rol").eq("id", user.id).maybeSingle();
    miNombre = data ? data.username : ""; esAdmin = !!data && data.rol === "admin";
  }
  await cargarFavs();
  if (!user && tab === "fav") tab = "top";
  paintUser();
  if (typeof foroUsuarioCambio === "function") foroUsuarioCambio();
  sel ? detail() : list();
}
sb.auth.onAuthStateChange((_e, s) => {
  user = s ? s.user : null; paintUser();
  if (user) $("dLogin").close();
  setTimeout(cargarNombre, 0);
  sel ? detail() : list();
});
sb.auth.getSession().then(({data}) => { user = data.session ? data.session.user : null; cargarNombre(); });

// ---------- Modo dibujar contorno (index.html?dibujar) ----------
if (DIB) {
  const pts = [], pg = L.polygon([], {color: "#f2b705", weight: 3}).addTo(map);
  const show = () => {
    pg.setLatLngs(pts);
    $("panel").innerHTML = `<b>Modo dibujar</b><p class="msg">Toca cada esquina del contorno, en orden. Copia el resultado y pégalo en <code>LIMITE</code>, dentro de config.js.</p><textarea rows="9" readonly onclick="this.select()">${JSON.stringify(pts.map(p => [+p.lat.toFixed(5), +p.lng.toFixed(5)]))}</textarea><div class="row"><button id="und">Deshacer</button></div>`;
    $("und").onclick = () => { pts.pop(); show(); };
  };
  map.on("click", e => { pts.push(e.latlng); show(); });
  show();
} else load();
</script>
